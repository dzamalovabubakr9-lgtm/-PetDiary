{% extends 'base.html' %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
{% if changed %}
  <div class="alert alert-success">Пароль успешно изменён.</div>
{% endif %}
<h1 class="page-title">Смена пароля</h1>
<form method="post" action="{% url 'change_password' %}" class="form">
  {% csrf_token %}
  {% for field in form %}
    <div class="form-group">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Сменить пароль</button>
  </div>
</form>
{% endblock %}
