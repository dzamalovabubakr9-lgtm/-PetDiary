{% extends 'base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<h1 class="page-title">Восстановление пароля</h1>
<form method="post" action="{% url 'reset_password' %}" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Отправить ссылку для сброса</button>
  </div>
</form>
<p class="form-note"><a href="{% url 'login' %}">Вспомнили пароль? Вернуться к входу.</a></p>
{% endblock %}
